name: Build
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/VERSION"
    types: [opened, synchronize, reopened]
  release:
    types: [published]

jobs:
  build_appimage:
    permissions:
      actions: read
      security-events: write
      contents: write
    name: 👻 Build Ghostty (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
          - arch: x86_64
            platform: linux/amd64
            runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - name: Checkout ghostty-appimage
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@7ff2bdc2fe97f9a4c6a4007f5f42fb4941f49fee # v4

      - name: Cache dependencies
        id: cache-ghostty
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/pacman
            /tmp/offline-cache
            /root/.cache/zig
          key: ${{ runner.os }}-${{ matrix.arch }}-ghostty-${{ hashFiles('**/VERSION') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ghostty-

      - name: Setup build environment
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "tip" > VERSION
          fi
          ./bin/setup-env.sh

      - name: Build Ghostty
        run: |
          ./bin/build-ghostty.sh

      - name: Bundle AppImage
        run: |
          ./bin/bundle-appimage.sh

      - name: Upload AppImage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-appimage-${{ matrix.arch }}
          retention-days: 7
          path: dist

  tag:
    name: "👻 Tip Tag"
    if: ${{ github.event_name == 'schedule' && github.ref_name == 'main' }}
    permissions:
      actions: read
      security-events: write
      contents: write
    runs-on: ubuntu-latest
    needs:
      - build_appimage
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]

      - name: Clean-up Old Release Assets
        run: |
          gh release view tip --json assets --jq '.assets[].name' | while read -r asset; do
            if [ -n "$asset" ]; then
              gh release delete-asset tip "${asset}" -y
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create 'tip' tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa tip -m "Latest Continuous Release" "${GITHUB_SHA}"
          git push --force origin tip

  release_stable:
    name: 👻 Release Ghostty AppImage (Stable)
    needs:
      - build_appimage
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: ghostty-appimage-aarch64

      - uses: actions/download-artifact@v6
        with:
          name: ghostty-appimage-x86_64

      - name: Ghostty stable
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.AppImage*"
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  release_nightly:
    name: 👻 Release Ghostty AppImage (Nightly)
    if: ${{ github.event_name == 'schedule' && github.ref_name == 'main' }}
    needs:
      - build_appimage
      - tag
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: ghostty-appimage-aarch64

      - uses: actions/download-artifact@v6
        with:
          name: ghostty-appimage-x86_64

      - name: Ghostty Tip ("Nightly")
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: '👻 Ghostty Tip ("Nightly")'
          prerelease: true
          tag_name: tip
          target_commitish: ${{ github.sha }}
          files: |
            *.AppImage*

  create_release_pr:
    name: "👻 Upstream Stable Release"
    if: ${{ github.event_name == 'schedule' && github.ref_name == 'main' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Detect upstream stable release
        id: detect
        run: |
          set -eu
          if version="$(./bin/check-upstream-release.sh)"; then
            echo "New upstream stable release: ${version}"
            echo "release=true" >> "${GITHUB_OUTPUT}"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
          else
            echo "No new upstream stable release"
            echo "release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Push release branch and tag
        if: ${{ steps.detect.outputs.release == 'true' }}
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -eux
          branch="release/${VERSION}"
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git checkout -B "${branch}" "origin/${branch}"
          else
            git checkout -b "${branch}"
            printf '%s\n' "${VERSION}" > VERSION
            git add VERSION
            git commit -m "chore(release): set VERSION to ${VERSION}"
            git push origin "${branch}"
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag -a "${tag}" -m "Ghostty ${VERSION}"
            git push origin "${tag}"
          fi

      - name: Open release pull request
        if: ${{ steps.detect.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -eux
          branch="release/${VERSION}"
          if [ -n "$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')" ]; then
            echo "Open pull request for ${branch} already exists"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "👻 Release Ghostty ${VERSION}" \
            --body "Automated release PR for upstream Ghostty \`${VERSION}\`.

          - Updates \`VERSION\` to \`${VERSION}\`
          - Adds tag \`v${VERSION}\`

          Upstream tag: https://github.com/ghostty-org/ghostty/releases/tag/v${VERSION}"
